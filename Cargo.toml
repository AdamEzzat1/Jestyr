[package]
name = "jestyrc"
version = "0.1.0"
edition = "2021"
description = "The Jestyr language compiler (bootstrap, written in Rust)"
license = "MIT OR Apache-2.0"

[[bin]]
name = "jestyrc"
path = "src/main.rs"

# Fast iteration is a Jestyr value; keep the bootstrap compiler's own build snappy too.
# The compiler itself has zero runtime dependencies (the lexer/parser are hand-written).
# Test-only dependencies provide property-based and fuzz testing.
[dev-dependencies]
proptest = "1"
bolero = "0.11"

[features]
# Opt-in counting global allocator for `jestyrc selfbench` (peak/total heap bytes).
# Off by default so the production compiler uses the plain System allocator.
bench-alloc = []
# Experimental: vendored D-HARHT deterministic table + `jestyrc dharht-bench`
# (D-HARHT Memory profile vs HashMap). Off by default; see docs/TESTING.md §6.
dharht-experiment = []
# gcc-in-test oracle: compile + run the `examples/std` demos through a real C
# compiler and assert their output (and a locked cross-OS SHA-256 canary). Requires
# a C compiler on PATH, so it is opt-in — default `cargo test` stays toolchain-free.
# Run with: `cargo test --features c-oracle`.
c-oracle = []

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
