# jagent.ini — the demo configuration for `jagent` (examples/std/jagent_cli.jtr).
#
# One [agent] section, then one [job.NAME] section per job. Every key not listed here is
# an error that names its line; see docs/jagent.md for the whole format.

[agent]
host = 127.0.0.1
port = 0
tls = false
store = jagent.db

[job.health-check]
kind = command
command = echo healthy
timeout_ms = 10000

[job.rotate-log]
kind = command
command = echo rotated
timeout_ms = 10000

# A job that runs itself every 30 seconds while `jagent serve` is up.
[job.heartbeat]
command = echo beat
timeout_ms = 10000
interval_ms = 30000
